<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    {% load static %}

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style1.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background: url("{% static 'images/q1.jpg' %}")
                no-repeat center center fixed;

            background-size: cover;
            transition: background-image 1.5s ease-in-out;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
        }

        .reset-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);

            border-radius: 24px;

            padding: 40px 30px;

            color: white;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35);
        }

        .icon-box {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.1);

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;
        }

        .icon-box i {
            font-size: 30px;
            color: #ffe600;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #dcdcdc;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #f1f1f1;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        .form-group input::placeholder {
            color: #cfcfcf;
        }

        .form-group input:focus {
            border-color: #ffe600;
            background: rgba(255, 255, 255, 0.12);
        }

        .submit-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 14px;

            background: #ffe600;

            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: white;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #ffe600;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .reset-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6rem;
            }
        }

    </style>
</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <div class="icon-box">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Reset Password</h1>

            <p class="subtitle">
                Enter your email address and we’ll send you
                instructions to reset your password.
            </p>

            <form method="post">

                {% csrf_token %}

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Send Reset Link
                </button>

            </form>

            <div class="back-link">
                <a href="{% url 'index' %}">
                    ← Back to Home
                </a>
            </div>

        </div>

    </div>

    <script>

        const imageUrls = [
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q1.jpg' %}",
            "{% static 'images/q10.jpg' %}"
        ];

        let currentImageIndex = 0;

        function changeBackgroundImage() {

            document.body.style.backgroundImage =
                `url(${imageUrls[currentImageIndex]})`;

            currentImageIndex =
                (currentImageIndex + 1) % imageUrls.length;
        }

        setInterval(changeBackgroundImage, 4000);

    </script>

</body>
</html>
