<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Reset Sent</title>

    {% load static %}

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, sans-serif;

        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
          url("{% static 'images/q2.jpg' %}");

        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 520px;
        padding: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.1);

        backdrop-filter: blur(12px);

        border-radius: 24px;

        padding: 40px 30px;

        color: white;

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }

      .icon-box {
        width: 85px;
        height: 85px;

        margin: 0 auto 25px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(255, 255, 255, 0.08);
      }

      .icon-box i {
        font-size: 38px;
        color: #ffe600;
      }

      h1 {
        text-align: center;
        margin-bottom: 15px;
        font-size: 2rem;
      }

      .message {
        text-align: center;
        color: #dddddd;
        line-height: 1.8;
        margin-bottom: 30px;
        font-size: 15px;
      }

      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        margin: 30px 0;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.3rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #f1f1f1;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;

        padding: 14px 16px;

        border-radius: 14px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.08);

        color: white;

        outline: none;

        font-size: 15px;
      }

      .form-group input::placeholder {
        color: #cccccc;
      }

      .form-group input:focus {
        border-color: #ffe600;
        background: rgba(255, 255, 255, 0.12);
      }

      .submit-btn {
        width: 100%;

        padding: 14px;

        border: none;
        border-radius: 14px;

        background: #ffe600;

        color: black;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s ease;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        background: white;
      }

      .back-home {
        margin-top: 25px;
        text-align: center;
      }

      .back-home a {
        color: #ffe600;
        text-decoration: none;
        font-size: 14px;
      }

      .back-home a:hover {
        text-decoration: underline;
      }

      @media (max-width: 550px) {
        .card {
          padding: 30px 20px;
        }

        h1 {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="icon-box">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <h1>Check Your Inbox</h1>

        <div class="message">
          <p>
            We’ve emailed you instructions for setting your password, if an
            account exists with the email you entered.
          </p>

          <br />

          <p>
            If you don’t receive an email shortly, check your spam folder and
            make sure the email address is correct.
          </p>
        </div>

        <div class="divider"></div>

        <h2>Resend Email</h2>

        <form method="post" action="{% url 'password_reset' %}">
          {% csrf_token %}

          <div class="form-group">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Resend Reset Email</button>
        </form>

        <div class="back-home">
          <a href="{% url 'index' %}"> ← Back to Home </a>
        </div>
      </div>
    </div>
  </body>
</html>
